[package]
name = "dual-dns-browser"
version = "1.1.8"
description = "DualDNS Browser"
authors = ["DualDNS"]
edition = "2021"
license = "MIT"

[lib]
name = "dual_dns_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tungstenite = "0.24"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip", "proxy-from-env"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
